
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Kawtar ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #170e2c, #38204c, #17172f);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    font-family: 'Arial', sans-serif;
    padding: 35px 15px;
}

h1 {
    color: #40e0d0;
    font-size: clamp(30px, 7vw, 55px);
    text-align: center;
    text-shadow: 0 0 15px #40e0d0;
    margin-bottom: 75px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #40e0d0; }
    to { text-shadow: 0 0 30px #40e0d0; }
}

.heart-container {
    position: relative;
    width: min(340px, 85vw);
    height: min(310px, 78vw);
    display: flex;
    align-items: center;
    justify-content: center;
    animation: beat 1.5s infinite;
}

.heart {
    position: absolute;
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 0 20px #fff);
}

.message {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 70%;
    margin-top: 35px;
}

.message h2 {
    color: #ff1744;
    font-size: clamp(19px, 5vw, 25px);
    margin-bottom: 12px;
    text-shadow: 0 0 8px pink;
}

.message p {
    color: #e9c5f5;
    font-size: clamp(14px, 3.8vw, 18px);
    font-weight: bold;
    line-height: 1.6;
}

@keyframes beat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.07); }
}

.love {
    color: white;
    font-size: 23px;
    margin-top: 55px;
    text-align: center;
    text-shadow: 0 0 15px pink;
}

.stars {
    position: fixed;
    color: white;
    animation: fall 6s linear infinite;
    opacity: 0.8;
    pointer-events: none;
}

@keyframes fall {
    from {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
    }
    to {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<h1>Ayyyy 3lik a Kawtar 💗</h1>

<div class="heart-container">

    <svg class="heart" viewBox="0 0 300 280">
        <path
        d="M150 260
        C120 230 10 150 10 80
        C10 20 90 0 150 65
        C210 0 290 20 290 80
        C290 150 180 230 150 260Z"
        fill="white"/>
    </svg>

    <div class="message">
        <h2>I Love You Kawtar ❤️</h2>
        <p>
            Hada cado lahsn Kawtar fdnya 💝
            <br>
            Ajmal bnt fdnya
            <br>
            Ou adrf bnt fdnya 🥹
        </p>
    </div>

</div>

<div class="love">
    Made with love, just for you Kawtar 💕
</div>

<script>
function createStar() {
    const star = document.createElement("div");
    star.className = "stars";
    star.innerHTML = Math.random() > 0.5 ? "💗" : "✨";

    star.style.left = Math.random() * 100 + "vw";
    star.style.top = "-20px";
    star.style.fontSize = (12 + Math.random() * 20) + "px";
    star.style.animationDuration = (3 + Math.random() * 5) + "s";

    document.body.appendChild(star);

    setTimeout(() => star.remove(), 8000);
}

setInterval(createStar, 300);
</script>

</body>
</html>
